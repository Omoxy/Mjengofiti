name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  backend:
    name: Go Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: apps/api/go.sum

      - name: Verify dependencies
        run: |
          cd apps/api
          go mod verify

      - name: Run go vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run backend tests
        run: |
          cd apps/api
          go test -v -count=1 ./...

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd apps/api
          govulncheck ./...

  frontend:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4.0.3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: |
          cd apps/web
          npm ci

      - name: Run linter
        run: |
          cd apps/web
          npm run lint

      - name: Run typecheck
        run: |
          cd apps/web
          npx tsc -b

      - name: Run unit tests
        run: |
          cd apps/web
          npm test -- --run

      - name: Build production bundle
        run: |
          cd apps/web
          npm run build

      - name: Audit production dependencies
        run: |
          cd apps/web
          npm audit --omit=dev

  formatting:
    name: Git Formatting & Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check whitespace and line endings
        run: |
          git diff --check

  secret-scan:
    name: Secret Detection Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version: '1.26.11'

      - name: Run Gitleaks scan
        run: |
          go install github.com/zricethezav/gitleaks/v8@latest
          gitleaks detect --source . --verbose --no-banner
