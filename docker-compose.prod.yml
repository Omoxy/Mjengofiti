services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mjengofiti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mjengofiti}
      POSTGRES_USER: ${DB_USER:-mjengofiti}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Compose}
    # Database is not exposed to the public internet in production.
    # Bound strictly to loopback interface if local administrative access is needed.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mjengofiti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mjengofiti} -d ${DB_NAME:-mjengofiti}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mjengofiti-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: mjengofiti-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: 8080
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?Set production APP_CORS_ORIGINS to an HTTPS origin}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-mjengofiti}
      DB_USER: ${DB_USER:-mjengofiti}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Compose}
      DB_SSLMODE: ${DB_SSLMODE:?Set DB_SSLMODE to require or verify-full}
      MAP_TILE_URL: ${MAP_TILE_URL:-https://api.maptiler.com/maps/streets-v2/style.json}
      AUTH_ENABLED: ${AUTH_ENABLED:?Set AUTH_ENABLED=true}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:?Set the trusted HTTPS JWT issuer}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Set the API JWT audience}
      JWT_SECRET: ${JWT_SECRET:?Set a random 32-byte JWT secret}
    # Internal API port bound to loopback for health monitoring; external traffic routes via Nginx reverse proxy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - mjengofiti-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:?Set VITE_MAPTILER_KEY in .env before building the web image}
    container_name: mjengofiti-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - mjengofiti-network

volumes:
  mjengofiti_pgdata:
    name: mjengofiti_pgdata

networks:
  mjengofiti-network:
    name: mjengofiti_network
