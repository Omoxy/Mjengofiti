services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mjengofiti-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-mjengofiti}
      POSTGRES_USER: ${DB_USER:-mjengofiti}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env before starting Compose}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - mjengofiti_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mjengofiti} -d ${DB_NAME:-mjengofiti}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mjengofiti-network

volumes:
  mjengofiti_pgdata:
    name: mjengofiti_pgdata

networks:
  mjengofiti-network:
    name: mjengofiti_network
